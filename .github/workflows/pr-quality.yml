name: PR quality

# The PR body and title are the review-facing proof. This gate keeps them honest:
# the four template sections must be present, in order, and non-empty; the proof
# section must carry an inline image or "Not applicable" with a reason; every
# image must be a renderable https URL; the title must be Conventional Commits;
# the head branch must be `<type>/<short-kebab-summary>`; and the Verification
# Summary names the PR head, tracked PRDs (or None with a reason), and the last
# North Star commit at that head. Covered changes name their PRDs and update
# them or explain unchanged behaviour. Machine-local paths fail. A push (`synchronize`)
# that moves the head past the body fails until it is re-checked. It runs on
# `edited` too, so fixing the body re-checks it without a new push.
# update-behind-prs.yml dispatches it on the PR branch with the PR number after
# it merges main in, because that push starts no pull_request run (ADR 0129).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose head is this branch
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: Validate PR body and title
    # Bot-authored PRs (Dependabot version bumps and similar) carry
    # machine-generated bodies, not the human proof contract. Every other
    # gate still applies to them in full.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The shared PRD parser imports the existing TypeScript dependency.
      - uses: ./.github/actions/setup
        with:
          persistent-store: ${{ vars.PNPM_STORE_DIR }}
          install-command: pnpm install --frozen-lockfile
      # Read the PR's current title, body and branch from the API, so a
      # pull_request run and a dispatch read them the same way. A dispatch must
      # name, by number, the open PR whose head is this branch. jq -c writes each
      # value as one JSON line, the shape toJSON gives, so a crafted body stays data.
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! [[ "${NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::inputs.pr must be a pull request number."
            exit 1
          fi
          pr="$(gh api "repos/${REPO}/pulls/${NUMBER}")"
          head="$(jq -r '.state + " " + .head.repo.full_name + ":" + .head.ref' <<< "${pr}")"
          if [ "${EVENT}" != pull_request ] && [ "${head}" != "open ${REPO}:${GITHUB_REF_NAME}" ]; then
            echo "::error::PR #${NUMBER} is ${head}, not open on this branch ${REPO}:${GITHUB_REF_NAME}."
            exit 1
          fi
          {
            echo "title=$(jq -c .title <<< "${pr}")"
            echo "body=$(jq -c .body <<< "${pr}")"
            echo "head-ref=$(jq -c .head.ref <<< "${pr}")"
            echo "base-sha=$(jq -r .base.sha <<< "${pr}")"
          } >> "${GITHUB_OUTPUT}"
      # The PR body, title, and head branch are untrusted input. They reach the
      # validator through the environment as JSON (never interpolated into the
      # run-script text), so a crafted body cannot break out into shell.
      # PR_HEAD_SHA and PR_BASE_SHA are passed raw on purpose: a SHA is plain hex, and the
      # validator rejects anything that is not 40 hex characters. A dispatch
      # judges the commit it runs on, the branch head, against main's tip now; a
      # pull_request run keeps the event's base, which its checkout fetched.
      - name: Validate
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base-sha }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head-ref }}
        run: node scripts/validate-pr-body.mjs
